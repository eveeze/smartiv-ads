version: '3.8'

services:
  # ---------------------------
  # 1. Aplikasi Backend (Placeholder Base)
  # ---------------------------
  app:
    container_name: smartiv-backend
    build: .
    networks:
      - smartiv-network

  # ---------------------------
  # 2. Database (PostgreSQL)
  # ---------------------------
  postgres:
    image: postgres:16-alpine
    container_name: smartiv-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartiv_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartiv-network

  # ---------------------------
  # 3. Queue & Cache (Redis)
  # ---------------------------
  redis:
    image: redis:alpine
    container_name: smartiv-redis
    ports:
      - '6379:6379'
    networks:
      - smartiv-network

  # ---------------------------
  # 4. Storage (MinIO - S3 Compatible)
  # ---------------------------
  minio:
    image: minio/minio
    container_name: smartiv-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - smartiv-network

  # ---------------------------
  # 5. Helper: Auto Create Bucket
  # ---------------------------
  createbuckets:
    image: minio/mc
    container_name: smartiv-createbuckets
    depends_on:
      - minio
    # [FIX] Tambahkan semicolon (;) sebelum 'do' dan 'done' untuk keamanan parsing one-liner
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO at smartiv-minio:9000...';
      until /usr/bin/mc alias set myminio http://smartiv-minio:9000 minioadmin minioadmin; do
        echo '...MinIO not ready yet, retrying in 1s...';
        sleep 1;
      done;
      echo '✅ MinIO Connected! Creating bucket...';
      /usr/bin/mc mb --ignore-existing myminio/smartiv-media;
      /usr/bin/mc anonymous set public myminio/smartiv-media;
      echo '🎉 Bucket created successfully!';
      exit 0;
      "
    networks:
      - smartiv-network

networks:
  smartiv-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
