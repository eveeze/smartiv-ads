version: '3.8'

services:
  # ---------------------------
  # 1. Aplikasi Backend (NestJS)
  # ---------------------------
  app:
    container_name: smartiv-ads-api-${ENV_NAME}
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${APP_PORT}:3000'
    depends_on:
      - postgres
      - redis
    networks:
      - smartiv-net
      - shared_network

  # ---------------------------
  # 2. Database (PostgreSQL)
  # ---------------------------
  postgres:
    image: postgres:15-alpine
    container_name: smartiv-ads-postgres-${ENV_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_${ENV_NAME}:/var/lib/postgresql/data
    networks:
      - smartiv-net

  # ---------------------------
  # 3. Queue & Cache (Redis)
  # ---------------------------
  redis:
    image: redis:alpine
    container_name: smartiv-ads-redis-${ENV_NAME}
    restart: unless-stopped
    networks:
      - smartiv-net

  # ---------------------------
  # 4. MinIO Bucket Creator (FIXED: No Comments & Legacy CPU)
  # ---------------------------
  createbuckets:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z-cpuv1
    container_name: smartiv-ads-createbuckets-${ENV_NAME}
    env_file:
      - .env
    # [FIX] Gunakan '|' agar newline terjaga, dan pastikan syntax loop shell benar
    entrypoint: |
      /bin/sh -c '
      echo "🔍 Config: Host=${MINIO_ENDPOINT}, Port=${MINIO_PORT}, Bucket=${MINIO_BUCKET}"

      # 1. Loop Tunggu Koneksi
      until /usr/bin/mc alias set myminio http://${MINIO_ENDPOINT}:${MINIO_PORT} ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY}; do
        echo "⏳ MinIO not ready... waiting 3s..."
        sleep 3
      done

      echo "✅ MinIO Connected!"

      # 2. Buat Bucket & Set Policy
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET}
      /usr/bin/mc policy set download myminio/${MINIO_BUCKET}
      /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET}

      echo "🎉 SUCCESS: Bucket ${MINIO_BUCKET} is now PUBLIC READ!"
      exit 0
      '
    networks:
      - shared_network

# Volume Data
volumes:
  postgres_data_prod:
  postgres_data_staging:

# Network
networks:
  smartiv-net:
    driver: bridge
  shared_network:
    external: true
