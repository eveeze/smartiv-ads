version: '3.8'

services:
  # ---------------------------
  # 1. Aplikasi Backend (NestJS)
  # ---------------------------
  app:
    container_name: smartiv-ads-api-${ENV_NAME}
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${APP_PORT}:3000'
    depends_on:
      - postgres
      - redis
    networks:
      - smartiv-net
      - shared_network # Konek ke MinIO & Nginx

  # ---------------------------
  # 2. Database (PostgreSQL)
  # ---------------------------
  postgres:
    image: postgres:15-alpine
    container_name: smartiv-ads-postgres-${ENV_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_${ENV_NAME}:/var/lib/postgresql/data
    networks:
      - smartiv-net

  # ---------------------------
  # 3. Queue & Cache (Redis)
  # ---------------------------
  redis:
    image: redis:alpine
    container_name: smartiv-ads-redis-${ENV_NAME}
    restart: unless-stopped
    networks:
      - smartiv-net

  # ---------------------------
  # 4. MinIO Bucket Creator (ROBOT)
  # ---------------------------
  createbuckets:
    image: minio/mc
    container_name: smartiv-ads-createbuckets-${ENV_NAME}
    env_file:
      - .env
    # Script: Tunggu 5 detik -> Login MinIO -> Bikin Bucket -> Set Public -> Mati
    entrypoint: >
      /bin/sh -c "
      echo '⏳ Waiting for MinIO...';
      sleep 5;
      /usr/bin/mc alias set myminio http://${MINIO_ENDPOINT}:${MINIO_PORT} ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET};
      /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET};
      echo '✅ Bucket ready & public!';
      exit 0;
      "
    networks:
      - shared_network # Wajib satu network sama MinIO

# Volume Data
volumes:
  postgres_data_prod:
  postgres_data_staging:

# Network
networks:
  smartiv-net:
    driver: bridge
  shared_network:
    external: true
