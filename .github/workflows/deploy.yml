name: Deploy SmartIV Ads

on:
  push:
    branches:
      - main
      - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Env (Prod vs Staging)
      - name: Set Environment Variables
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENV_NAME=prod" >> $GITHUB_ENV
            echo "APP_PORT=3000" >> $GITHUB_ENV
          else
            echo "ENV_NAME=staging" >> $GITHUB_ENV
            echo "APP_PORT=3001" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.ENV_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Copy docker-compose ke VPS
      - name: Copy Compose File
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}
          source: 'docker-compose.prod.yml'
          target: '~/smartiv-ads-${{ env.ENV_NAME }}'

      # Deploy SSH
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            echo "🚀 Deploying to ${{ env.ENV_NAME }}..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export ENV_NAME=${{ env.ENV_NAME }}
            export APP_PORT=${{ env.APP_PORT }}
            export APP_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.ENV_NAME }}

            cd ~/smartiv-ads-$ENV_NAME

            # --- GENERATE .ENV ---
            echo "Generating .env file..."

            # Logic Pemisahan Environment
            if [ "$ENV_NAME" == "prod" ]; then
              echo "NODE_ENV=production" > .env
              echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env
              # Prod pakai settingan dari secrets (bisa True/False tergantung secret)
              echo "MIDTRANS_IS_PRODUCTION=${{ secrets.MIDTRANS_IS_PRODUCTION }}" >> .env
            else
              echo "NODE_ENV=staging" > .env
              # Staging pakai URL Frontend khusus (jika ada, jika tidak kosongkan atau samakan)
              echo "FRONTEND_URL=${{ secrets.FRONTEND_URL_STAGING }}" >> .env
              # Staging dipaksa FALSE (Sandbox) walaupun key-nya sama
              echo "MIDTRANS_IS_PRODUCTION=false" >> .env
            fi

            # 1. DATABASE & AUTH (Aman, Data terpisah oleh Volume Docker)
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "JWT_EXPIRES_IN=1d" >> .env

            # 2. REDIS (HARDCODED)
            echo "REDIS_HOST=redis" >> .env
            echo "REDIS_PORT=6379" >> .env

            # 3. MINIO INTERNAL
            echo "MINIO_ENDPOINT=minio-server" >> .env
            echo "MINIO_PORT=9000" >> .env
            echo "MINIO_USE_SSL=false" >> .env

            # 4. MINIO EXTERNAL & BUCKET ISOLATION
            echo "MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}" >> .env
            echo "MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}" >> .env
            echo "MINIO_PUBLIC_URL=${{ secrets.MINIO_PUBLIC_URL }}" >> .env

            # [FITUR PENTING] Nama bucket otomatis ditambah akhiran -prod atau -staging
            # Contoh: smartiv-media-prod / smartiv-media-staging
            echo "MINIO_BUCKET=${{ secrets.MINIO_BUCKET }}-${ENV_NAME}" >> .env

            # 5. INTEGRASI LAIN (Pakai Key yg sama untuk sementara karena masih Sandbox)
            echo "MAIL_HOST=${{ secrets.MAIL_HOST }}" >> .env
            echo "MAIL_USER=${{ secrets.MAIL_USER }}" >> .env
            echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env
            echo "MAIL_PORT=${{ secrets.MAIL_PORT }}" >> .env
            echo "MAIL_FROM=${{ secrets.MAIL_FROM }}" >> .env

            echo "MIDTRANS_SERVER_KEY=${{ secrets.MIDTRANS_SERVER_KEY }}" >> .env
            echo "MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }}" >> .env

            # --- EXECUTE ---
            docker pull $APP_IMAGE

            # Pass variabel ke docker compose
            ENV_NAME=$ENV_NAME APP_PORT=$APP_PORT APP_IMAGE=$APP_IMAGE POSTGRES_USER=${{ secrets.POSTGRES_USER }} POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} POSTGRES_DB=${{ secrets.POSTGRES_DB }} docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "⏳ Waiting for DB to be ready (30s)..."
            sleep 30

            # Gunakan binary local agar versi Prisma aman
            ENV_NAME=$ENV_NAME APP_PORT=$APP_PORT APP_IMAGE=$APP_IMAGE POSTGRES_USER=${{ secrets.POSTGRES_USER }} POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} POSTGRES_DB=${{ secrets.POSTGRES_DB }} docker compose -f docker-compose.prod.yml exec -T app ./node_modules/.bin/prisma migrate deploy

            docker image prune -f
