name: Deploy SmartIV Ads

on:
  push:
    branches: ['main']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Docker Buildx (WAJIB ADA untuk fitur Cache GHA)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Login ke GHCR
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Build & Push Docker Image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Cache config ini sekarang akan berjalan lancar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Deploy ke VPS
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Masuk folder
            cd ~/smartiv-ads-backend

            export APP_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            docker pull $APP_IMAGE

            # Update container
            APP_IMAGE=$APP_IMAGE docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Migrasi DB
            APP_IMAGE=$APP_IMAGE docker compose -f docker-compose.prod.yml exec -T app npx prisma migrate deploy

            docker image prune -f
