name: Deploy SmartIV Ads

on:
  push:
    branches: ['main'] # Trigger deploy saat push ke main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Login ke GHCR
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Build & Push Docker Image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Cache agar build lebih cepat
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Deploy ke VPS
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            # Login Docker di VPS
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Masuk folder App (Pastikan folder ini dibuat dulu di langkah 2)
            cd ~/smartiv-ads-backend

            # Definisikan nama image terbaru
            export APP_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Pull Image
            docker pull $APP_IMAGE

            # Restart Container (Update)
            # Kita pass variable APP_IMAGE ke docker-compose
            APP_IMAGE=$APP_IMAGE docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Jalankan Migrasi Database Otomatis
            APP_IMAGE=$APP_IMAGE docker compose -f docker-compose.prod.yml exec -T app npx prisma migrate deploy

            # Hapus image lama (Clean up)
            docker image prune -f
